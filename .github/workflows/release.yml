name: Release APK

# 推送 v* 标签时：云端构建 release APK 并发布 GitHub Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:   # 也支持手动触发构建 debug 包

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('*.gradle', 'gradle/wrapper/*.properties', 'app/build.gradle') }}

      - name: Build debug APK (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (tag run)
        if: github.event_name == 'push'
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        id: apk
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            SRC=app/build/outputs/apk/release/app-release-unsigned.apk
            NAME=78ham-${GITHUB_REF_NAME}-release-unsigned.apk
          else
            SRC=app/build/outputs/apk/debug/app-debug.apk
            NAME=78ham-debug.apk
          fi
          cp "$SRC" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          sha256sum "$NAME" > "$NAME.sha256"

      - name: Upload artifact (every build)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256

      - name: Create GitHub Release (tag run)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256
          generate_release_notes: true
